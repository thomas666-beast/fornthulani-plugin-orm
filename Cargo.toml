[package]
name = "fornthulani-plugin-orm"
version = "0.2.0"
edition = "2024"
description = "Eloquent-style models, relations with eager loading, query builder, migrations, SQLite and PostgreSQL drivers for the fornthulani micro HTTP framework."
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomas666-beast/fornthulani-plugin-orm"
keywords = ["fornthulani", "orm", "sqlite", "postgresql", "eloquent"]
categories = ["web-programming::http-server", "database"]

[features]
default = ["sqlite"]
# Bundled SQLite driver (rusqlite).
sqlite = ["dep:rusqlite"]
# PostgreSQL driver (sync `postgres` crate, built-in connection pool).
postgres = ["dep:postgres", "dep:bytes"]
# TLS for PostgreSQL (`sslmode=prefer` opportunistic, `sslmode=require` verified), via native-tls.
postgres-tls = ["postgres", "dep:postgres-native-tls", "dep:native-tls"]
# `unique:` and `exists:` rules for fornthulani-plugin-validate.
validation = ["dep:fornthulani-plugin-validate"]

[dependencies]
fornthulani = { path = "../fornthulani", version = "0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
postgres = { version = "0.19", optional = true }
bytes = { version = "1", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
fornthulani-plugin-validate = { path = "../fornthulani-plugin-validate", version = "0.1", optional = true }

[dev-dependencies]
fornthulani-plugin-validate = { path = "../fornthulani-plugin-validate", version = "0.1" }
